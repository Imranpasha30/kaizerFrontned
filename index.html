<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaizer X — AI Video Editor & Shorts Generator Studio</title>
    <meta name="description" content="Turn one video into a polished feature cut and ready-to-post Shorts with AI captions, images, branding & SEO. Edit live, publish to all your channels." />
    <link rel="canonical" href="https://kaizerx.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Kaizer X — AI Video Editor & Shorts Generator Studio" />
    <meta property="og:description" content="Turn one video into a polished feature cut and ready-to-post Shorts with AI captions, images, branding & SEO. Edit live, publish to all your channels." />
    <meta property="og:url" content="https://kaizerx.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kaizerx.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kaizer X — turn one video into a polished feature cut and ready-to-post Shorts." />
    <meta property="og:site_name" content="Kaizer X" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaizer X — AI Video Editor & Shorts Generator Studio" />
    <meta name="twitter:description" content="Turn one video into a polished feature cut and ready-to-post Shorts with AI captions, images, branding & SEO. Edit live, publish to all your channels." />
    <meta name="twitter:image" content="https://kaizerx.com/og-image.png" />
    <meta name="twitter:image:alt" content="Kaizer X — turn one video into a polished feature cut and ready-to-post Shorts." />
    <!--
      JSON-LD structured data so Google's OAuth verifier can read the
      application identity programmatically. The app name MUST match
      the OAuth consent screen exactly ("Kaizer X").
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kaizer X",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "url": "https://kaizerx.com/",
        "description": "Turn one video into a polished feature cut and ready-to-post Shorts with AI captions, images, branding & SEO. Edit live, publish to all your channels.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does Kaizer X actually do?",
            "acceptedAnswer": { "@type": "Answer", "text": "It turns one source video into a polished feature cut plus several vertical Shorts, with images, captions, branding, and SEO-ready metadata, then lets you publish to your connected channels." }
          },
          {
            "@type": "Question",
            "name": "How fast is a re-render?",
            "acceptedAnswer": { "@type": "Answer", "text": "Edits in the canvas re-render in roughly 10–15 seconds because only the editing stage re-runs." }
          },
          {
            "@type": "Question",
            "name": "What video shapes are supported?",
            "acceptedAnswer": { "@type": "Answer", "text": "Any — widescreen, vertical, or square. Kaizer X measures your source and picks a layout automatically." }
          },
          {
            "@type": "Question",
            "name": "How many Shorts will I get?",
            "acceptedAnswer": { "@type": "Answer", "text": "At least four per job, often more, carved from your stories." }
          },
          {
            "@type": "Question",
            "name": "What languages are supported?",
            "acceptedAnswer": { "@type": "Answer", "text": "Multiple, including auto-detect and specific scripts like Telugu, with native-script captions." }
          },
          {
            "@type": "Question",
            "name": "Is my content safe?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes — encrypted credentials, an append-only credit ledger, durable job queue, and a quality-control gate on every render." }
          },
          {
            "@type": "Question",
            "name": "Can my whole team share footage?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes — the shared Library lets anyone browse, rate, and reuse source videos to start new jobs." }
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kaizer X",
        "legalName": "Sharkify Private Limited",
        "url": "https://kaizerx.com/",
        "logo": "https://kaizerx.com/og-image.png",
        "sameAs": [
          "https://www.youtube.com/@kaizerx",
          "https://www.instagram.com/kaizerx",
          "https://www.facebook.com/kaizerx",
          "https://www.linkedin.com/company/kaizerx"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://kaizerx.com/" },
          { "@type": "ListItem", "position": 2, "name": "Features", "item": "https://kaizerx.com/#features" },
          { "@type": "ListItem", "position": 3, "name": "How it works", "item": "https://kaizerx.com/#how" },
          { "@type": "ListItem", "position": 4, "name": "Library", "item": "https://kaizerx.com/#library" },
          { "@type": "ListItem", "position": 5, "name": "FAQ", "item": "https://kaizerx.com/#faq" }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23E0312B'/><text x='4' y='24' font-size='22' font-weight='bold' fill='white'>K</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static legal links present in the raw HTML so crawlers (Google's
      OAuth consent-screen verifier in particular) find a link to the
      privacy policy without needing to execute the React bundle. The
      React Landing page renders its own footer with the same links
      after hydration; this static block sits at the very bottom and
      is genuinely visible (no off-screen / aria-hidden tricks that
      could trip cloaking detection).
    -->
    <!--
      Static product description present in the raw HTML so Google's
      OAuth verifier can read the app name + purpose without executing
      the React bundle. The React Landing page renders the same info
      visibly above the fold after hydration; this block is a fallback
      for crawlers / no-JS browsers.
    -->
    <noscript>
      <main style="padding:32px 24px;color:#1a1a1a;font-family:Inter,system-ui,sans-serif;max-width:720px;margin:0 auto;">
        <h1 style="font-size:28px;font-weight:900;margin:0 0 12px 0;">Kaizer X</h1>
        <p style="font-size:16px;line-height:1.6;color:#333;margin:0 0 18px 0;">
          Kaizer X is an AI video automation platform that turns
          long-form recordings into multiple short-form clips and
          publishes them to creators' YouTube channels on their behalf
          using the YouTube Data API with the creator's explicit
          consent.
        </p>
        <p style="font-size:14px;color:#555;margin:0 0 18px 0;">
          The full app requires JavaScript. Read our
          <a href="/privacy" style="color:#E0312B;">Privacy Policy</a>
          and
          <a href="/terms" style="color:#E0312B;">Terms of Service</a>.
        </p>
      </main>
    </noscript>
    <footer style="text-align:center;padding:12px 16px;font-size:12px;color:#9ca3af;font-family:Inter,system-ui,sans-serif;">
      <a href="/privacy" style="color:inherit;text-decoration:underline;margin-right:14px;">Privacy Policy</a>
      <a href="/terms" style="color:inherit;text-decoration:underline;">Terms of Service</a>
    </footer>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
